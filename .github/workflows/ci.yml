name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"
      - name: Bajar el código al runner
        uses: actions/checkout@v7
      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/backend-results:/out" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("backend-results/coverage.xml").getroot()
          print("### Coverage del backend")
          print("| métrica | % |")
          print("|---|---|")
          print(f"| líneas | {float(r.get('line-rate')) * 100:.1f} |")
          print(f"| ramas | {float(r.get('branch-rate')) * 100:.1f} |")
          EOF

      - name: Publicar coverage del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-results

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v7
      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const t = require('./frontend-coverage/reporte/coverage-summary.json').total
          if (!t.lines.total) { console.error('midió 0 archivos: revisá el include'); process.exit(1) }
          console.log('### Coverage del frontend')
          console.log('| métrica | % |')
          console.log('|---|---|')
          console.log(`| líneas | ${t.lines.pct} |`)
          console.log(`| ramas | ${t.branches.pct} |`)
          EOF

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    timeout-minutes: 15
    steps:
      # TP7: Render ya no construye. Se le dice QUÉ IMAGEN ejecutar: la que este pipeline verificó y publicó.
      - name: Disparar el deploy en Render con la imagen sha-<commit>
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA corra ESTE commit)
        shell: bash
        env:
          URL_API: https://bioconect.onrender.com
          URL_FRONT: https://bioconect-front-qa.onrender.com
        run: |
          echo "Esperando a que QA corra $GITHUB_SHA..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" | grep -q "$GITHUB_SHA" \
               && curl -fsS --max-time 10 "$URL_API/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/version.txt" | grep -q "$GITHUB_SHA" \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "✅ QA corre $GITHUB_SHA (API, base y front)"
              exit 0
            fi
            sleep 20
          done
          echo "❌ QA no llegó a correr este commit a tiempo"
          exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: ./frontend
      - name: Integración contra la API de QA (base real, sin navegador)
        env:
          API_BASE_URL: https://bioconect.onrender.com
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend
      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion              # si la API está rota, no gastamos un navegador en confirmarlo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias y el navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: e2e contra el front de QA (navegador real)
        env:
          E2E_BASE_URL: https://bioconect-front-qa.onrender.com
          API_BASE_URL: https://bioconect.onrender.com
        run: npx playwright test e2e/login.spec.js
        working-directory: ./frontend
      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                      # EL gate: sin e2e verde, ni siquiera se pide aprobación
    environment: production
    timeout-minutes: 15
    steps:
      - name: Disparar el deploy en Render con LA MISMA imagen que pasó por QA
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMG_API: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que PROD corra ESTE commit)
        shell: bash
        env:
          URL_API: https://bioconect-api-prod.onrender.com
          URL_FRONT: https://bioconect-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD corra $GITHUB_SHA..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" | grep -q "$GITHUB_SHA" \
               && curl -fsS --max-time 10 "$URL_API/health/db" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/version.txt" | grep -q "$GITHUB_SHA" \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null; then
              echo "✅ PROD corre $GITHUB_SHA (API, base y front)"
              exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no llegó a correr este commit a tiempo"
          exit 1